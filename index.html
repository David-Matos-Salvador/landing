<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>David Matos</title>
  <meta name="description" content="David Matos builds things for the web, and the server they run on.">
  <meta name="theme-color" content="#1B1530">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23FFB45C'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=M+PLUS+1+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
      }
    }
  </script>
</head>
<body data-mode="lofi">
  <canvas id="scene" aria-label="A small 3D room at night: rain on the window, a desk lamp and a laptop with code."></canvas>

  <main class="page">
    <header class="intro">
      <h1 class="name">David<br>Matos</h1>
      <p class="tagline">I build things for the web, and the server they run on.</p>
      <nav class="links" aria-label="Profiles">
        <a href="https://github.com/David-Matos-Salvador" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </header>

    <div class="player">
      <button id="play" class="play" type="button" aria-pressed="false">
        <span class="play__icon" aria-hidden="true"></span>
        <span class="play__label">Play bachata</span>
      </button>
      <div class="spotify" id="spotify" aria-hidden="true">
        <div id="spotify-embed"></div>
      </div>
    </div>
  </main>

  <audio id="music" src="music/bachata.mp3" preload="none" loop></audio>
  <noscript><p class="noscript">Turn on JavaScript to see the room.</p></noscript>
  <script type="module" src="main.js"></script>
</body>
</html>
